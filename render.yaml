services:
  - type: web
    name: text-rpg-proto
    env: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: text-rpg-db
          property: connectionString

databases:
  - name: text-rpg-db
    databaseName: text_rpg_proto
    plan: free
