<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Магазин — RPG World</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/items.css">
</head>
<body data-page="shop">
  <div class="page-shell">
    <main class="panel gear-page">
      <header class="auth-header">
        <span class="eyebrow">Торговая лавка</span>
        <h1>Магазин</h1>
      </header>
      <p class="gold-display">Золото: <strong id="gold">0</strong></p>
      <button id="buySetButton" class="buy-set-button" type="button">Купить набор за 10000 золота</button>
      <h2>Товары торговца</h2>
      <div id="shopItems" class="gear-list"></div>
      <h2>Ваши предметы</h2>
      <div id="playerItems" class="gear-list"></div>
      <p id="pageMessage" class="gear-message" role="status" aria-live="polite"></p>
      <nav class="gear-nav" aria-label="Навигация">
        <a href="/character">В профиль</a>
        <a href="/city">В город</a>
      </nav>
    </main>
  </div>
  <script src="/js/items.js"></script>
  <script src="/gear-pages.js"></script>
</body>
</html>
