<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Бой — War of Souls</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="experience-bar-container" role="progressbar" aria-label="Опыт" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="experience-bar-fill"></div>
  </div>
  <div class="page-shell fight-page">
    <div class="panel character-page">
      <div class="auth-header">
        <span class="eyebrow" id="fightLocation"></span>
        <h1 id="fightStatus">Бой</h1>
      </div>
      <div id="enemies" class="enemies"></div>
      <div id="battleLog" class="battle-log"></div>
      <div id="fightButtons" class="button-row"></div>
    </div>
  </div>

  <script src="/experience-bar.js"></script>
  <script src="/fight.js"></script>
</body>
</html>
