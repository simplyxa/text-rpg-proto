<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>War of Souls</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/items.css">
</head>
<body>
  <div class="experience-bar-container" role="progressbar" aria-label="Опыт" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="experience-bar-fill"></div>
    <span class="experience-percentage">0%</span>
  </div>
  <div id="app">
    <div id="authScreen" class="auth-screen">
      <div class="auth-card panel">
        <div class="auth-header">
          <span class="eyebrow">Северное фэнтези RPG</span>
          <h1>War of Souls</h1>
          <p class="subtitle">Создайте героя или войдите в мир холодных пустошей, древних клятв и кровавых легенд.</p>
        </div>

        <div class="auth-mode-switch" aria-label="Режим входа">
          <button class="mode-btn active" data-auth-mode="register" type="button">Создать героя</button>
          <button class="mode-btn" data-auth-mode="login" type="button">Войти</button>
        </div>

        <div class="auth-panels">
          <div id="registerPanel" class="auth-panel active">
            <div class="auth-panel-header">
              <h3>Новый персонаж</h3>
              <span class="chip">Новый путь</span>
            </div>

            <div class="auth-form">
              <label>
                <span>Ник</span>
                <input id="newNickname" type="text" placeholder="Например: Arterion" maxlength="24" />
              </label>

              <label>
                <span>Класс</span>
                <select id="newClass">
                  <option value="warrior">Воин</option>
                  <option value="healer">Лекарь</option>
                  <option value="mage">Маг</option>
                </select>
              </label>

              <label>
                <span>Фракция</span>
                <select id="newFaction">
                  <option value="light">Светлые</option>
                  <option value="dark">Тёмные</option>
                </select>
              </label>

              <label>
                <span>Пароль</span>
                <input id="newPassword" type="password" placeholder="Минимум 4 символа" maxlength="32" />
              </label>

              <button id="createBtn" class="primary-btn" type="button">Создать персонажа</button>
              <button id="startGameBtn" class="secondary-btn hidden" type="button">Начать игру</button>
              <small class="helper-text">Советуем придумать пароль заранее и не хранить его в открытом виде.</small>
            </div>
          </div>

          <div id="loginPanel" class="auth-panel">
            <div class="auth-panel-header">
              <h3>Вход для героя</h3>
              <span class="chip neutral">Старый герой</span>
            </div>

            <div class="auth-form login-form">
              <label>
                <span>Ник</span>
                <input id="loginNickname" type="text" placeholder="Ваш ник" maxlength="24" />
              </label>

              <label>
                <span>Пароль</span>
                <input id="loginPassword" type="password" placeholder="Пароль" maxlength="32" />
              </label>

              <button id="loginBtn" class="primary-btn" type="button">Войти</button>
            </div>
          </div>
        </div>

        <div class="heroes-box">
          <div class="heroes-header">
            <h3>Выбрать героя</h3>
          </div>
          <div id="characterList" class="character-list"></div>
        </div>
      </div>
    </div>

    <section id="game" class="game hidden">
      <aside class="sidebar panel">
        <h2>Персонаж</h2>
        <div id="stats" class="stats-box"></div>

        <h3>Локации</h3>
        <div id="locations" class="button-group"></div>

        <h3>Действия</h3>
        <div class="button-group">
          <button id="fightBtn" type="button">Атаковать</button>
          <button id="invBtn" type="button">Инвентарь</button>
          <button id="questBtn" type="button">Квесты</button>
          <button id="shopBtn" type="button">Магазин</button>
          <button id="towersBtn" type="button" onclick="window.location.href='/towers-map'">⚔️ Битва за Башню</button>
        </div>
      </aside>

      <main class="main panel">
        <div id="gameStatus" class="status-bar"></div>

        <div class="tabs">
          <button class="tab-button active" data-tab="profile" type="button">Персонаж</button>
          <button class="tab-button" data-tab="inventory" type="button">Инвентарь</button>
          <button class="tab-button" data-tab="equipment" type="button">Снаряжение</button>
          <button class="tab-button" data-tab="quests" type="button">Квесты</button>
          <button class="tab-button" data-tab="shop" type="button">Магазин</button>
        </div>

        <div class="tab-panel active" id="profile-panel">
          <div id="profileContent" class="content-box"></div>
        </div>

        <div class="tab-panel" id="inventory-panel">
          <div id="inventoryContent" class="content-box"></div>
        </div>

        <div class="tab-panel" id="equipment-panel">
          <div id="equipmentContent" class="content-box equipment-panel"></div>
        </div>

        <div class="tab-panel" id="quests-panel">
          <div id="questsContent" class="content-box"></div>
        </div>

        <div class="tab-panel" id="shop-panel">
          <div id="shopContent" class="content-box"></div>
        </div>

        <div id="log" class="log"></div>
      </main>
    </section>
  </div>

  <script src="/js/items.js"></script>
  <script src="/experience-bar.js"></script>
  <script src="/app.js"></script>
</body>
</html>
