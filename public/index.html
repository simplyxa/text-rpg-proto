<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RPG World</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <h1>RPG World</h1>
      </div>
      <div class="topbar-actions">
        <button id="createBtn">Создать героя</button>
        <button id="loadBtn">Загрузить</button>
      </div>
    </header>

    <section class="panel create-panel">
      <input id="name" placeholder="Имя героя" />
      <select id="class">
        <option value="warrior">Воин</option>
        <option value="rogue">Разбойник</option>
        <option value="mage">Маг</option>
      </select>
    </section>

    <section id="game" class="game hidden">
      <aside class="sidebar panel">
        <h2>Персонаж</h2>
        <div id="stats"></div>

        <h3>Локации</h3>
        <div id="locations" class="button-group"></div>

        <h3>Действия</h3>
        <div class="button-group">
          <button id="fightBtn">Атаковать</button>
          <button id="invBtn">Инвентарь</button>
          <button id="questBtn">Квесты</button>
          <button id="shopBtn">Магазин</button>
        </div>
      </aside>

      <main class="main panel">
        <div id="gameStatus" class="status-bar"></div>
        <div id="log" class="log"></div>
      </main>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
