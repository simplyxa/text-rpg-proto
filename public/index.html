<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RPG World</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <div id="authScreen" class="auth-screen">
      <div class="auth-card panel">
        <div class="auth-header">
          <span class="eyebrow">Добро пожаловать в</span>
          <h1>RPG World</h1>
        </div>

        <div class="auth-columns">
          <div class="auth-panel">
            <h3>Новый персонаж</h3>
            <div class="auth-form">
              <label>
                <span>Ник</span>
                <input id="newNickname" type="text" placeholder="Например: Arterion" maxlength="24" />
              </label>

              <label>
                <span>Класс</span>
                <select id="newClass">
                  <option value="warrior">Воин</option>
                  <option value="rogue">Разбойник</option>
                  <option value="mage">Маг</option>
                </select>
              </label>

              <label>
                <span>Пароль</span>
                <input id="newPassword" type="password" placeholder="Минимум 4 символа" maxlength="32" />
              </label>

              <button id="createBtn" class="primary-btn">Создать персонажа</button>
              <small class="helper-text">Советуем завести пароль к 10 уровню.</small>
              <button id="startGameBtn" class="secondary-btn hidden">Начать игру</button>
            </div>
          </div>

          <div class="auth-panel">
            <h3>Вход для героя</h3>
            <div class="auth-form login-form">
              <label>
                <span>Ник</span>
                <input id="loginNickname" type="text" placeholder="Ваш ник" maxlength="24" />
              </label>

              <label>
                <span>Пароль</span>
                <input id="loginPassword" type="password" placeholder="Пароль" maxlength="32" />
              </label>

              <button id="loginBtn" class="primary-btn">Войти</button>
            </div>
          </div>
        </div>

        <div class="heroes-box">
          <div class="heroes-header">
            <h3>Выбрать героя</h3>
          </div>
          <div id="characterList" class="character-list"></div>
        </div>
      </div>
    </div>

    <section id="game" class="game hidden">
      <aside class="sidebar panel">
        <h2>Персонаж</h2>
        <div id="stats" class="stats-box"></div>

        <h3>Локации</h3>
        <div id="locations" class="button-group"></div>

        <h3>Действия</h3>
        <div class="button-group">
          <button id="fightBtn">Атаковать</button>
          <button id="invBtn">Инвентарь</button>
          <button id="questBtn">Квесты</button>
          <button id="shopBtn">Магазин</button>
        </div>
      </aside>

      <main class="main panel">
        <div id="gameStatus" class="status-bar"></div>

        <div class="tabs">
          <button class="tab-button active" data-tab="profile">Персонаж</button>
          <button class="tab-button" data-tab="inventory">Инвентарь</button>
          <button class="tab-button" data-tab="quests">Квесты</button>
          <button class="tab-button" data-tab="shop">Магазин</button>
        </div>

        <div class="tab-panel active" id="profile-panel">
          <div id="profileContent" class="content-box"></div>
        </div>

        <div class="tab-panel" id="inventory-panel">
          <div id="inventoryContent" class="content-box"></div>
        </div>

        <div class="tab-panel" id="quests-panel">
          <div id="questsContent" class="content-box"></div>
        </div>

        <div class="tab-panel" id="shop-panel">
          <div id="shopContent" class="content-box"></div>
        </div>

        <div id="log" class="log"></div>
      </main>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
