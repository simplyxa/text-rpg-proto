<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ежедневные квесты — War of Souls</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="experience-bar-container" role="progressbar" aria-label="Опыт" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="experience-bar-fill"></div>
  </div>
  <div class="page-shell">
    <main class="panel quests-page">
      <header class="auth-header">
        <span class="eyebrow">Испытания героя</span>
        <h1>Ежедневные квесты</h1>
      </header>

      <div class="daily-quest-info">
        <div class="streak-counter">Дней подряд: <strong id="streakDays">0</strong></div>
        <time class="date-display" id="currentDate"></time>
      </div>
      <p class="quest-page-message" id="questMessage" role="status"></p>

      <section class="daily-quest-section">
        <h2>Активные квесты</h2>
        <div class="daily-quests-list" id="activeQuestsList"></div>
      </section>
      <section class="daily-quest-section">
        <h2>Завершённые квесты</h2>
        <div class="daily-quests-list" id="completedQuestsList"></div>
      </section>
      <section class="daily-quest-section">
        <h2>Пропущенные квесты</h2>
        <div class="daily-quests-list" id="skippedQuestsList"></div>
      </section>

      <nav class="daily-quest-nav" aria-label="Навигация">
        <a class="btn-nav" href="/character">В профиль</a>
        <a class="btn-nav" href="/city">В город</a>
      </nav>
    </main>
  </div>
  <script src="/experience-bar.js"></script>
  <script src="/quests.js"></script>
</body>
</html>
