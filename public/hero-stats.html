<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Статистика героя — War of Souls</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

      <div id="heroStats" class="content-box"></div>
