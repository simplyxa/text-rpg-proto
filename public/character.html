<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Персонаж — RPG World</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="experience-bar-container" role="progressbar" aria-label="Опыт" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="experience-bar-fill"></div>
    <span class="experience-percentage">0%</span>
  </div>
  <div class="page-shell">
    <div class="panel character-page">
      <div class="auth-header">
        <span class="eyebrow">Профиль героя</span>
        <h1 id="title">Загрузка...</h1>
      </div>

      <div id="characterCard" class="content-box"></div>

      <div class="button-row">
        <button id="playBtn" class="primary-btn" type="button">Играть</button>
        <button id="logoutBtn" class="secondary-btn" type="button">Выйти</button>
      </div>
    </div>
  </div>

  <script src="/experience-bar.js"></script>
  <script src="/character.js"></script>
</body>
</html>
