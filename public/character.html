<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Персонаж — RPG World</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/items.css">
</head>
<body>
  <div class="experience-bar-container" role="progressbar" aria-label="Опыт" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="experience-bar-fill"></div>
    <span class="experience-percentage">0%</span>
  </div>
  <div class="page-shell">
    <div class="panel character-page">
      <div class="auth-header">
        <span class="eyebrow">Профиль героя</span>
        <h1 id="title">Загрузка...</h1>
      </div>

      <nav class="character-nav" aria-label="Навигация персонажа">
        <a href="/inventory">Инвентарь</a>
        <a href="/equipment">Снаряжение</a>
        <a href="/enhancement">К усилению</a>
      </nav>

      <div id="characterCard" class="content-box"></div>
      <p id="profileMessage" class="gear-message" role="status" aria-live="polite"></p>

      <nav class="character-nav character-nav-bottom" aria-label="Навигация по миру">
        <a href="/city">В город</a>
      </nav>
    </div>
  </div>

  <script src="/js/items.js"></script>
  <script src="/experience-bar.js"></script>
  <script src="/character.js"></script>
</body>
</html>
