<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мой герой — War of Souls</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/items.css">
</head>
<body>
  <div class="experience-bar-container" role="progressbar" aria-label="Опыт" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="experience-bar-fill"></div>
    <span class="experience-percentage">0%</span>
  </div>
  <div class="page-shell">
    <main class="panel character-page">
      <header class="auth-header">
        <span class="eyebrow">Профиль героя</span>
        <h1 id="title">Мой герой</h1>
      </header>

      <section id="profileIdentity" class="profile-hero" aria-label="Герой"></section>

      <nav class="character-nav profile-menu" aria-label="Разделы героя">
        <a href="#" data-profile-placeholder="Достижения">Достижения <span>›</span></a>
        <a href="#" data-profile-placeholder="Анкета">Анкета <span>›</span></a>
        <a href="/equipment">Снаряжение <span>›</span></a>
        <a href="#" data-profile-placeholder="Умения">Умения <span>›</span></a>
        <a href="/inventory">Рюкзак <span>›</span></a>
        <a href="#" data-profile-placeholder="Сундук">Сундук <span>›</span></a>
        <a href="#" data-profile-placeholder="Витрина">Витрина <span>›</span></a>
        <a href="#" data-profile-placeholder="Почта">Почта <span>›</span></a>
      </nav>

      <div id="characterCard" class="content-box"></div>
      <p id="profileMessage" class="gear-message" role="status" aria-live="polite"></p>

      <nav class="character-nav character-nav-bottom" aria-label="Навигация по миру">
        <a href="/city">В город <span>›</span></a>
      </nav>
    </main>
  </div>

  <script src="/js/items.js"></script>
  <script src="/experience-bar.js"></script>
  <script src="/js/towers.js"></script>
  <script src="/character.js"></script>
</body>
</html>
