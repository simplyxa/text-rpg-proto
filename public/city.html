<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Город — War of Souls</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="experience-bar-container" role="progressbar" aria-label="Опыт" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="experience-bar-fill"></div>
    <span class="experience-percentage">0%</span>
  </div>
  <div class="page-shell">
    <div class="panel character-page">
      <div class="auth-header">
        <span class="eyebrow" id="heroName"></span>
        <h1 id="cityTitle">Город</h1>
      </div>

      <div class="content-box">
        <p>Вы в городе. Выберите действие:</p>

        <ul class="location-list">
          <li><a href="/forest">Лес</a> — тёмный лес, одиночные враги.</li>
          <li><a href="/cave">Пещера</a> — группа врагов и босс.</li>
        </ul>

        <div class="button-column">
          <button class="primary-btn" data-action="shop" type="button">Магазин</button>
          <button class="primary-btn" data-action="inventory" type="button">Инвентарь</button>
          <button class="primary-btn" data-action="quests" type="button">Квесты</button>
          <button class="primary-btn" data-action="profile" type="button">Персонаж</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/experience-bar.js"></script>
  <script src="/city.js"></script>
</body>
</html>
