<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Город — War of Souls</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-shell">
    <div class="panel character-page">
      <div class="auth-header">
        <span class="eyebrow">Город</span>
        <h1 id="cityTitle">Загрузка...</h1>
      </div>

      <div class="content-box">
        <p>Вы в городе. Выберите действие:</p>

        <div class="button-column">
          <button class="primary-btn" data-action="forest" type="button">Лес</button>
          <button class="primary-btn" data-action="cave" type="button">Пещера</button>
          <button class="primary-btn" data-action="shop" type="button">Магазин</button>
          <button class="primary-btn" data-action="inventory" type="button">Инвентарь</button>
          <button class="primary-btn" data-action="quests" type="button">Квесты</button>
          <button class="primary-btn" data-action="profile" type="button">Профиль</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/city.js"></script>
</body>
</html>
