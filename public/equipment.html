<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Снаряжение — RPG World</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/items.css">
</head>
<body data-page="equipment">
  <div class="page-shell">
    <main class="panel gear-page equipment-screen">
      <h1 class="equipment-title">Моё снаряжение</h1>
      <div class="equipment-actions">
        <button type="button" id="repairAllButton" class="equipment-action">Починить все вещи <span>›</span></button>
        <a href="/inventory" class="equipment-action">Открыть рюкзак <span>›</span></a>
      </div>
      <div class="equipment-hero">
        <div id="equipmentPortrait" class="equipment-portrait" role="img" aria-label="Персонаж">?</div>
        <p id="equipmentTotal" class="equipment-total armor-stat">Общая защита: 0</p>
      </div>
      <div id="equipmentList" class="gear-list equipment-items"></div>
      <p id="pageMessage" class="gear-message" role="status" aria-live="polite"></p>
      <nav class="gear-nav" aria-label="Навигация">
        <a href="/character">В профиль</a>
        <a href="/enhancement">К усилению</a>
        <a href="/city">В город</a>
      </nav>
    </main>
  </div>
  <script src="/js/items.js"></script>
  <script src="/gear-pages.js"></script>
  <script src="/hp-bar.js"></script>
</body>
</html>
